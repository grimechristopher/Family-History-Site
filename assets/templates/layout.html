{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{.Title}} &middot; Family History</title>
<link rel="stylesheet" href="/static/css/app.css?v={{.AssetVersion}}">
<!-- Not deferred: the reader's saved colour and size choices are applied
     before first paint, so nobody watches the page change underneath them. -->
<script src="/static/js/display.js?v={{.AssetVersion}}"></script>
</head>
<body>
<a class="skip" href="#main">Skip to the questions</a>
{{if .User}}
<header class="bar">
  <a class="bar-title" href="/">Family History</a>
  <div class="bar-tools">
    <details class="display-settings">
      <summary>Text &amp; colours</summary>
      <div class="display-panel">
        <h3 id="ds-size">Text size</h3>
        <div class="display-row" role="group" aria-labelledby="ds-size">
          <button type="button" data-setting="size" data-value="auto">Normal</button>
          <button type="button" data-setting="size" data-value="lg">Larger</button>
          <button type="button" data-setting="size" data-value="xl">Largest</button>
        </div>
        <h3 id="ds-contrast">Contrast</h3>
        <div class="display-row" role="group" aria-labelledby="ds-contrast">
          <button type="button" data-setting="contrast" data-value="auto">Normal</button>
          <button type="button" data-setting="contrast" data-value="more">Stronger</button>
        </div>
      </div>
    </details>
    <form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <a class="tab" href="/cards" {{if eq .Nav "cards"}}aria-current="page"{{end}}>Questions to answer</a>
  <a class="tab" href="/questions" {{if eq .Nav "questions"}}aria-current="page"{{end}}>Everything</a>
  <a class="tab" href="/tree" {{if eq .Nav "tree"}}aria-current="page"{{end}}>The family</a>
</nav>
{{end}}

<main class="page" id="main" tabindex="-1">
  {{block "content" .}}{{end}}
</main>

<script src="/static/js/htmx.min.js?v={{.AssetVersion}}" defer></script>
{{block "scripts" .}}{{end}}
</body>
</html>{{end}}
