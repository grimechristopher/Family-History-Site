# One line per family line. Fields, separated by |:
#
#   slug | tree file | prompts file | -person arguments | extra names
#
# The GEDCOM is per line and not global, because different branches of a family
# are often exported separately, and running a line against the wrong file
# imports a smaller family without failing.
#
# A -person argument is "Heading=email=GEDCOM name", where the heading is the
# "# ..." line in the prompts file and the GEDCOM name may be left off for
# somebody who is asked questions but is not in the tree. Repeat it with ';;'
# where several people answer the same set -- four siblings asked about their
# parents get one question each of them can answer, not four copies of it.
#
# Copy this to lines.conf and fill in your own. lines.conf, prompts/ and gedcom/
# are all gitignored: they are real names, real addresses and family records, and
# this repository is public. The names below are the invented ones the parser is
# tested against.

hale    | gedcom/hale.ged    | prompts/hale.md    | Dad=dad@example.com=Peter John /Hale/ | Margaret Irene /Ward/
brennan | gedcom/brennan.ged | prompts/brennan.md | Mom=mom@example.com=Ruth Ann /Brennan/;;Aunt=aunt@example.com |
