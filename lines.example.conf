# One line per family line. Fields, separated by |:
#
#   slug | GEDCOM | prompts file | -person arguments | extra GEDCOM names
#
# The GEDCOM is per line because different branches of a family are often
# exported separately, and running a line against the wrong file imports a
# smaller family without failing.
#
# A -person argument is "Heading=email=GEDCOM name", where the heading is the
# "# ..." line in the prompts file and the GEDCOM name may be left off for
# somebody who is asked questions but is not in the tree. Repeat it with ';;'
# where several people answer the same set.
#
# Copy this to lines.conf and fill in your own. lines.conf, prompts/ and
# gedcom/ are all gitignored: they are real names, addresses and family records.

grime  | gedcom/one.ged | prompts/grime.md  | Dad=dad@example.com=James Andrew /Grime/  | Lela /Wisehaupt/
ayres  | gedcom/one.ged | prompts/ayres.md  | Mom=mom@example.com=Lori Ann /Ayres/      |
lucero | gedcom/two.ged | prompts/lucero.md | Dad=robert@example.com=Robert Arturo /Lucero/;;Frank Lucero=frank@example.com |
